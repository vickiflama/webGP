<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin-pedidos.css">
    <title>Panel de Pedidos - Admin Gran Prix</title>
</head>
<body>

    <header class="navbar">
        <div class="logo-header">
            <a href="index.html">
                <img src="img/Fondo Blanco GP.png" alt="Logo Gran Prix" class="logo">
            </a>
        </div>
        <div class="nav-right">
            <span id="admin-usuario-mail" ></span>
            <a href="#" onclick="cerrarSesionAdmin()" class="aSalir">
                <i class="fa-solid fa-right-from-bracket"></i> Salir
            </a>
        </div>
    </header>

    <section class="admin-section">
        <h2 class="admin-titulo"><i class="fa-solid fa-box"></i> Panel de Pedidos</h2>
        <nav class="admin-nav">
            <a class="admin-nav-link activo" href="admin-pedidos.html"><i class="fa-solid fa-box"></i> Pedidos</a>
            <a class="admin-nav-link" href="admin-suscriptores.html"><i class="fa-solid fa-bullhorn"></i> Suscriptores</a>
        </nav>

        <div class="admin-filtros">
            <button class="filtro-estado activo" data-estado="todos" onclick="filtrarPorEstado('todos')">Todos</button>
            <button class="filtro-estado" data-estado="pendiente" onclick="filtrarPorEstado('pendiente')">Pendiente</button>
            <button class="filtro-estado" data-estado="preparando" onclick="filtrarPorEstado('preparando')">Preparando</button>
            <button class="filtro-estado" data-estado="despachado" onclick="filtrarPorEstado('despachado')">Despachado</button>
            <button class="filtro-estado" data-estado="entregado" onclick="filtrarPorEstado('entregado')">Entregado</button>
            <button class="filtro-estado" data-estado="cancelado" onclick="filtrarPorEstado('cancelado')">Cancelado</button>
        </div>

        <div class="admin-buscador">
            <div class="campo campo-texto">
                <label for="filtro-texto">Buscar</label>
                <input type="search" id="filtro-texto" placeholder="Nombre, N° de pedido o teléfono" oninput="aplicarFiltros()">
            </div>
            <div class="campo">
                <label for="filtro-desde">Desde</label>
                <input type="date" id="filtro-desde" onchange="aplicarFiltros()">
            </div>
            <div class="campo">
                <label for="filtro-hasta">Hasta</label>
                <input type="date" id="filtro-hasta" onchange="aplicarFiltros()">
            </div>
            <button class="btn-limpiar" onclick="limpiarFiltros()"><i class="fa-solid fa-eraser"></i> Limpiar</button>
            <button class="btn-papelera" onclick="abrirPapelera()"><i class="fa-solid fa-trash-can"></i> Papelera</button>
        </div>
        <div class="admin-contador" id="admin-contador"></div>

        <div id="admin-sin-pedidos" style="display:none">
            <p>No hay pedidos que coincidan con los filtros.</p>
        </div>

        <div id="admin-lista-pedidos"></div>
    </section>

    <!-- MODAL DETALLE / HISTORIAL -->
    <div class="modal-overlay" id="modal-admin-detalle">
        <div class="modal modal-detalle-contenido">
            <button class="modal-cerrar" onclick="cerrarDetalleAdmin()">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h2 class="modal-titulo" id="admin-detalle-nro"></h2>
            <div id="admin-detalle-contenido"></div>
        </div>
    </div>

    <!-- MODAL PAPELERA -->
    <div class="modal-overlay" id="modal-papelera">
        <div class="modal modal-detalle-contenido">
            <button class="modal-cerrar" onclick="cerrarPapelera()">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h2 class="modal-titulo">Papelera</h2>
            <div id="papelera-contenido"></div>
        </div>
    </div>

    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <p class="loading-texto">Cargando...</p>
    </div>

    <script type="module" src="admin-pedidos.js?v=4"></script>
    <script type="module" src="firebase.js"></script>
    <script type="module" src="admin-pedidos-firebase.js?v=4"></script>
</body>
</html>
