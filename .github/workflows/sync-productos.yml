name: Sincronizar productos ChessERP

on:
  schedule:
    - cron: '0 9 * * *'  # 9:00 UTC = 6:00 Argentina (todos los días)
  workflow_dispatch:      # permite correrlo a mano desde GitHub

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sincronizar productos
        env:
          CHESS_USUARIO: ${{ secrets.CHESS_USUARIO }}
          CHESS_PASSWORD: ${{ secrets.CHESS_PASSWORD }}
        run: node scripts/sync-productos.js

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/productos.json
          git diff --staged --quiet || git commit -m "🔄 Catálogo actualizado $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push