<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login.css">
    <title>Recuperar contraseña - Gran Prix Mayorista</title>
</head>
<body class="login-page">

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo-header">
            <a href="index.html">
                <img src="img/Fondo Blanco GP.png" alt="Logo Gran Prix" class="logo">
            </a>
        </div>
        <div class="search-wrap">
            <div class="search-box">
                <input type="text" placeholder="Buscador">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </div>
        <div class="nav-right">
            <button class="btn-whatsapp">
                <a href="https://whatsapp.com/channel/0029Vb6qGCDBqbrIjmq6QQ01" target="_blank" rel="noopener noreferrer">
                    <i class="fa-brands fa-whatsapp"></i>
                    Sumate al canal de WhatsApp
                </a>
            </button>
            <button class="btn-login">
                <i class="fa-regular fa-circle-user"></i>
                LOGIN
            </button>
            <div class="cart-wrap">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge">0</span>
            </div>
        </div>
    </header>

    <!-- FORMULARIO RECUPERAR -->
    <section class="login-section">
        <div class="login-box">
            <p class="login-titulo">Recuperá tu contraseña</p>

            <div class="recuperar-banner">
                Por favor ingresá tu mail con el que te registraste, y te enviaremos las instrucciones para recuperar tu contraseña.
            </div>

            <input type="email" placeholder="Correo electrónico*" class="input-field" id="recuperar-email">

            <div class="login-botones">
                <button class="btn-registrar" onclick="enviarRecuperar()">ENVIAR</button>
            </div>
        </div>
    </section>

    <script src="javascript.js"></script>
    <script src="login.js"></script>
    <script type="module" src="firebase.js"></script>
</body>
</html>
